<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMS Sign Up</title>
  <link rel="stylesheet" href="../style/signup.css">
</head>

<body>
  <div class="signup-container">
    <h2>Create Account</h2>
    <p>Join our Learning Management System</p>

    <form id="validateForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter Your Full Name" required />
        <span id="nameError" class="error-message"></span>
      </div>

      <div class="form-group">
        <label for="email">Enter your Email</label>
        <input type="email" id="email" placeholder="Enter Your Email" required />
        <span id="emailError" class="error-message"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required />
        <span id="passworderror" class="error-message"></span>
      </div>

      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="Confirm your password" required />
        <span id="conformpassworderror" class="error-message"></span>
      </div>

      <button type="button" onclick="validateForm(event)">Create Account</button>
      <p id="submitStatus" class="success-message"></p>
    </form>

    <div class="login-link">
      Already have an account? <a href="../pages/login.html">Login</a>
    </div>
  </div>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="../jspages/firebase-init.js"></script>
  <script src="../jspages/signup.js"></script>

</body>

</html>
