<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Growly | Login</title>
  <link rel="stylesheet" href="../style/login.css">
</head>

<body>
  <div class="login-container">
    <h2>Welcome Back </h2>
    <p>Login to your <strong>Growly</strong> account and continue your learning journey.</p>

    <form class="forms" id="formvalidation">
      <input type="text" id="username" placeholder="Username or Email">
      <span id="usernameError" class="error-message"></span>
      <input type="password" id="password" placeholder="Password">
      <span id="passwordError" class="error-message"></span>
      <button type="button" onclick="validateForm(event)">Login Your Account</button>
      <p id="submitStatus" class="success-message"></p>
      <a href="../pages/signup.html">Create a new account</a>

    </form>
  </div>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="../jspages/firebase-init.js"></script>
  <script src="../jspages/login.js"></script>

</body>

</html>
