<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growly | To-Do List</title>
    <link rel="stylesheet" href="../style/todo.css">
</head>

<body>


    <div class="container">
        <h2>My Learning Tasks</h2>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="What do you want to learn/do next?">
            <button class="add-btn" onclick="addTask()">Add Task</button>
        </div>

        <h3>Pending Tasks</h3>
        <ul id="taskList">
        </ul>

        <div class="finished-section">
            <h3>Finished Tasks</h3>
            <ul id="finishedList">
            </ul>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script src="../jspages/firebase-init.js"></script>
    <script src="../jspages/todo.js"></script>
    <script src="../jspages/auth-helper.js"></script>
</body>

</html>
