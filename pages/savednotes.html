<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Notes - LMS</title>
  <link rel="stylesheet" href="../style/about.css">
</head>

<body>
  <nav>
    <h1>Growly 🌱</h1>
    <ul>
      <li><a href="../index.html">Home</a></li>
      <li><a href="../pages/coursemain.html">Courses</a></li>

      <li><a href="../pages/contact.html">Contact</a></li>
      <li><a href="../pages/login.html">Login</a></li>
    </ul>

  <header>
    Your Saved Notes 🌱
  </header>

  <div class="container">
    <div class="section">
      <h2>All Your Notes</h2>
      <div id="notes-container">
        <p>Loading notes...</p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../jspages/firebase-init.js"></script>
  <script src="../jspages/video-interactions.js"></script>
  <script src="../jspages/auth-helper.js"></script>

  
  <script>
    // Function to load all saved notes
    async function loadAllNotes() {
      const user = auth.currentUser;
      if (!user) {
        document.getElementById('notes-container').innerHTML = '<p>Please login to view your notes.</p>';
        return;
      }

      try {
        console.log("Attempting to load notes for UID:", user.uid);
        const userDocRef = db.collection("users").doc(user.uid).collection("videoData");
        const snapshot = await userDocRef.get();

        if (snapshot.empty) {
          document.getElementById('notes-container').innerHTML = '<p>No notes saved yet.</p>';
          return;
        }

        let notesHtml = '';
        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.notes && data.notes.trim()) {
            notesHtml += `
              <div class="note-card" style="background:#fff; padding:15px; border-radius:8px; margin-bottom:15px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
                <h3>Video: ${doc.id}</h3>
                <textarea id="notes-${doc.id}" rows="4" style="width:100%; padding:10px; border-radius:5px; border:1px solid #ccc;">${data.notes}</textarea>
                <button onclick="updateNotes('${doc.id}')" style="margin-top:10px; background:#4caf50; color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">Update Note</button>
              </div>
            `;
          }
        });

        if (notesHtml) {
          document.getElementById('notes-container').innerHTML = notesHtml;
        } else {
          document.getElementById('notes-container').innerHTML = '<p>No notes saved yet.</p>';
        }
      } catch (error) {
        console.error("Error loading notes:", error);
        if (error.code === 'permission-denied') {
          document.getElementById('notes-container').innerHTML = `
            <div style="background:#ffebee; color:#c62828; padding:20px; border-radius:8px; border:1px solid #ef9a9a;">
              <h3>Firebase Permission Error</h3>
              <p>It looks like your Firestore Security Rules are blocking access.</p>
              <p><strong>Solution:</strong> Go to your <b>Firebase Console -> Firestore Database -> Rules</b> and ensure they allow access to subcollections.</p>
              <pre style="background:#fff; padding:10px; margin-top:10px;">match /users/{userId}/{allPaths=**} {
  allow read, write: if request.auth != null && request.auth.uid == userId;
}</pre>
            </div>
          `;
        } else {
          document.getElementById('notes-container').innerHTML = '<p>Error loading notes. Please check the console.</p>';
        }
      }
    }

    // Function to update notes
    async function updateNotes(videoId) {
      const user = auth.currentUser;
      if (!user) {
        alert("Please login to update notes.");
        return;
      }

      const textarea = document.getElementById('notes-' + videoId);
      if (!textarea) return;

      const content = textarea.value;

      try {
        const docRef = db.collection("users").doc(user.uid).collection("videoData").doc(videoId);
        await docRef.set({ notes: content }, { merge: true });
        alert("Notes updated!");
      } catch (error) {
        console.error("Error updating notes:", error);
        alert("Failed to update notes.");
      }
    }

    // Load notes when user logs in
    auth.onAuthStateChanged(user => {
      if (user) {
        loadAllNotes();
      }
    });
  </script>
</body>

</html>
