<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
        }

        .quiz-container {
            width: 420px;
            margin: 100px auto;
            margin-top: 200px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .option {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            font-size: 20px;
        }

        .option:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2 id="question">Question</h2>

    <div id="options">
        <button class="option" onclick="checkAnswer(0)"></button>
        <button class="option" onclick="checkAnswer(1)"></button>
        <button class="option" onclick="checkAnswer(2)"></button>
        <button class="option" onclick="checkAnswer(3)"></button>
    </div>

    <p id="progress"></p>
    <p id="score"></p>
</div>

<script src="../jspages/quizhtml.js"></script>
</body>
</html>
